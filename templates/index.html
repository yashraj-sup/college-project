<!DOCTYPE html>
<html lang="en">
    <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Management</title>
    <link rel="stylesheet"  href="{{url_for('static', filename='style.css')}}">
</head>
<body>
    <form method="POST" action="/add">
        <input type="text" name="student_name" placeholder="Enter student's name" required>
        <input type="number" name="student_age" placeholder="Enter student's age" required>
        <input type="number" name="student_marks"  placeholder="Enter student's marks" required>
        <button type="submit">Add</button>
    </form>
    <table>
        <caption>Students Data</caption>
        <thead>
            <tr>
                <th scope="col">ID</th>
                <th scope="col">Name</th>
                <th scope="col">Age</th>
                <th scope="col">Marks</th>
            </tr>
        </thead>
        <tbody>
            {% for s in students %}
            <tr>
                <td>{{s.0}}</td>
                <td>{{s.1}}</td>
                <td>{{s.2}}</td>
                <td>{{s.3}}</td>
            </tr>
            {% endfor %}

    </table>
</body>
</html>
