<!DOCTYPE html>
<html lang="en">
    <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit student</title>
    <link rel="stylesheet"  href="{{url_for('static', filename='style.css')}}">
</head>
<body>
    <form method="POST" action="/update/{{student.0}}">
        <input type="text" name="student_name" placeholder="Enter student's name" value="{{student.1}}" required>
        <input type="number" name="student_age" placeholder="Enter student's age"  value="{{student.2}}" required>
        <input type="number" name="student_marks"  placeholder="Enter student's marks"  value="{{student.3}}" required>
        <button type="submit">Update</button>
        <a href="/">Cancel</a>
    </form>
    
</body>
